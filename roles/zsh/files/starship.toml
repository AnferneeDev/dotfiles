"$schema" = 'https://starship.rs/config-schema.json'

# THEME: Neon Pink Slate, matching the OpenCode neon-pink theme

format = """
[](#ff0066)\
$os\
$username\
[](bg:#ff2b7a fg:#ff0066)\
$directory\
[](fg:#ff2b7a bg:#ffd400)\
$git_branch\
$git_status\
[](fg:#ffd400 bg:#3d4854)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#3d4854 bg:#35404b)\
$docker_context\
[](fg:#35404b bg:#2f3943)\
$time\
[ ](fg:#2f3943)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "fg:#ffffff bg:#ff0066"
style_root = "fg:#ffffff bg:#ff0066"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "fg:#ffffff bg:#ff0066"
disabled = true # Disabled by default

[directory]
style = "fg:#ffffff bg:#ff2b7a"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "fg:#ffffff bg:#35404b"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "fg:#222226 bg:#ffd400"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:#222226 bg:#ffd400"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "fg:#ffffff bg:#3d4854"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:#ffffff bg:#35404b"
format = '[ ♥ $time ]($style)'
