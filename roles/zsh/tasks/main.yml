---
- name: Create plugins directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/zsh/plugins"
    state: directory
    mode: '0755'

- name: Clone zsh-autosuggestions plugin
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    dest: "{{ ansible_env.HOME }}/.config/zsh/plugins/zsh-autosuggestions"
    depth: 1
    update: false

- name: Clone zsh-syntax-highlighting plugin
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    dest: "{{ ansible_env.HOME }}/.config/zsh/plugins/zsh-syntax-highlighting"
    depth: 1
    update: false

- name: Deploy .zshrc
  ansible.builtin.copy:
    src: .zshrc
    dest: "{{ ansible_env.HOME }}/.zshrc"
    backup: true
    mode: '0644'

- name: Create .config directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config"
    state: directory
    mode: '0755'

- name: Deploy starship.toml
  ansible.builtin.copy:
    src: starship.toml
    dest: "{{ ansible_env.HOME }}/.config/starship.toml"
    mode: '0644'

- name: Deploy my_ascii_art.txt
  ansible.builtin.copy:
    src: my_ascii_art.txt
    dest: "{{ ansible_env.HOME }}/.config/my_ascii_art.txt"
    mode: '0644'

- name: Find zsh path
  ansible.builtin.command: which zsh
  register: zsh_path
  changed_when: false

- name: Set zsh as default shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_env.USER }}"
    shell: "{{ zsh_path.stdout }}"
